name: Build Linq GTFS

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed from thelinqtunnelbus.ca
        run: python3 build_linq_gtfs.py --out linq_gtfs.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate (fails the run on any ERROR notice)
        run: |
          curl -sL -o v.jar https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar
          java -jar v.jar -i linq_gtfs.zip -o report -c ca
          python3 -c "import json,sys; e=[n for n in json.load(open('report/report.json'))['notices'] if n['severity']=='ERROR']; [print(n['code'],n['totalNotices']) for n in e]; sys.exit(1 if e else 0)"

      - name: Commit feed if it changed
        run: |
          git config user.name  "gtfs-bot"
          git config user.email "gtfs-bot@users.noreply.github.com"
          git add linq_gtfs.zip
          git diff --cached --quiet || git commit -m "Update GTFS feed $(date -u +%F)"
          git push
